# Builds piccolo's Android APKs with android/build-apk.sh, the same script as
# on the development machine, and uploads them as artifacts:
#   piccolo.apk          arm64-v8a, Android 9+, Vulkan (OpenGL ES 3 fallback)
#   piccolo-legacy.apk   armeabi-v7a, Android 5+, OpenGL ES 2 only: the SHIELD
#                        Portable (Tegra 4) and other 32-bit devices without
#                        Vulkan (build-apk.sh --legacy, docs/gl.md)
# Install it with:
#   adb install --no-incremental -r piccolo.apk
# Signed with the release key from the repository secrets
# ANDROID_KEYSTORE_BASE64 (the PKCS12 keystore, base64) and
# ANDROID_KEYSTORE_PASS: package site.multitap.piccolo, updates install over
# each other. Where the secrets aren't available (pull requests from forks)
# it's a debug build: site.multitap.piccolo.debug, "piccolo debug", signed by
# a key made for that run.
#
# The development machine (Linux arm64) uses the distro's clang with the
# NDK's sysroot; on GitHub's x86_64 runners the NDK's own clang does the same
# job (MULTITAP_LLVM_ROOT). The SDK's build tools (aapt2, d8, zipalign,
# apksigner) come with the runner.
name: Android

# Tags: release.yml calls this workflow for v* tags (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  NDK_VERSION: r30
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  android:
    name: Android (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            flags: ''
            apk: piccolo.apk
            artifact: piccolo-android-arm64
          - name: armeabi-v7a, legacy
            flags: --legacy
            apk: piccolo-legacy.apk
            artifact: piccolo-android-armv7-legacy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versionCode is the commit count

      # Only the submodules the build uses; Test libretro goes into the APK.
      # Some nested submodules (imguisw's third_party) have SSH URLs, which
      # the runner has no key for: GitHub's are fetched over HTTPS instead.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 \
            deps/SDL deps/imgui deps/libretro-common deps/libsamplerate \
            deps/gamemode deps/miniz deps/7zip deps/enet deps/monocypher deps/qrcodegen deps/beacon \
            deps/piccolo-shaders \
            deps/common/hosts-common deps/common/frontends-common deps/common/retroui \
            deps/libretro/host-libretro deps/libretro/frontend-libretro
          git submodule update --init --recursive --checkout --depth 1 deps/test-libretro
          # librashader: its C headers (shader_chain) and the library itself,
          # which build-apk.sh builds with cargo into the APK. Not --recursive:
          # its own submodules are tests.
          git submodule update --init --depth 1 deps/librashader

      # r30: its libc++ has std::from_chars for double (frontends-common's
      # settings); the NDK the runner comes with may be older.
      - name: Cache the NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: Download the NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"

      # The host build (strings generator) configures all of piccolo, so it
      # needs the Vulkan headers (SDL is a console build there: no X11).
      - name: SDK platform, build tools, Ninja, host packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libvulkan-dev

      # librashader is Rust: the runner's rustup gets the Android target
      # (build-apk.sh uses ~/.cargo/bin/cargo). Crates and the build are
      # cached per librashader commit and NDK.
      - name: Rust for Android
        run: rustup target add aarch64-linux-android

      - name: Cache librashader
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            android/build/librashader/target
          key: librashader-android-${{ env.NDK_VERSION }}-${{ hashFiles('deps/librashader/Cargo.lock') }}

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PICCOLO_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export PICCOLO_KEYSTORE="$RUNNER_TEMP/release.p12"
            export PICCOLO_KEY_ALIAS=piccolo
          fi
          ndk="$HOME/android-ndk-${NDK_VERSION}"
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          export PATH="$tools:$PATH"
          export ANDROID_NDK_ROOT="$ndk"
          export MULTITAP_LLVM_ROOT="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-${ANDROID_API}/android.jar"
          export AAPT_ANDROID_JAR="$ANDROID_JAR"
          export D8_JAR="$tools/lib/d8.jar"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export BUILD_TYPE=Release
          android/build-apk.sh ${{ matrix.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android/build/${{ matrix.apk }}
