# Builds piccolo's Flatpak (flatpak/site.multitap.piccolo.yml) for x86_64 and
# aarch64, and uploads each .flatpak bundle as an artifact. Install one with:
#   flatpak install --user piccolo-<arch>.flatpak
name: Flatpak

# Tags: release.yml calls this workflow for v* tags (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Only the submodules the build uses.
      # deps/librashader without --recursive: its own submodules are tests.
      - name: Submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive --depth 1 \
            deps/SDL deps/imgui deps/libretro-common deps/libsamplerate \
            deps/gamemode deps/miniz deps/7zip deps/enet deps/monocypher deps/qrcodegen deps/beacon \
            deps/piccolo-shaders \
            deps/common/hosts-common deps/common/frontends-common deps/common/retroui \
            deps/libretro/host-libretro deps/libretro/frontend-libretro
          git submodule update --init --depth 1 deps/librashader
          # Test libretro ships in every package. Its nested submodules
          # (imguisw's) have SSH URLs: fetched over HTTPS instead.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --checkout --depth 1 deps/test-libretro

      # The image comes with the SDK installed, and flatpak-builder updates it.
      # On the x86_64 runners that update fails with "Invalid cross-device
      # link": Docker's overlayfs can't rename folders that are in the image's
      # layers. A copy of the install folder is in the container's own layer,
      # where renaming works.
      - name: Make the installed runtimes updatable
        run: |
          for dir in /var/lib/flatpak "$HOME/.local/share/flatpak"; do
            if [ -d "$dir" ]; then
              cp -a "$dir" "$dir.copy"
              rm -rf "$dir"
              mv "$dir.copy" "$dir"
            fi
          done

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: piccolo-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/site.multitap.piccolo.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
