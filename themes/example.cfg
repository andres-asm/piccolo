# GRAY: a gray theme, piccolo's BLUE with the color taken out.
#
# A theme is a .cfg file in the themes folder, next to the program or in
# piccolo's own folder (the one with settings/ in it): copy this one, rename
# it, change the colors. SETTINGS > INTERFACE > THEME lists it by its name.
# A theme in piccolo's folder with the same name as one next to the program
# replaces it.
#
# The keys are the same as the ui_ keys in settings/piccolo.cfg, so a look
# made color by color in SETTINGS can be copied from there into a theme.
# Colors are #RRGGBB. A key left out keeps BLUE's value.

name = GRAY

# Switches: true or false. (A # starts a comment only at the start of a line.)
# a box behind each menu title on the bar
ui_menu_boxes = false
# drop shadows under windows, menus and menu text
ui_shadows = false
# piccolo's own pixel arrow instead of the system's
ui_theme_cursor = false

# behind the menu when no game runs
ui_color_background = #000000
# the menu bar, top and bottom
ui_color_bar = #585858
# the menu bar's middle (a gradient; the same = flat)
ui_color_bar_center = #585858
# the bar's raised edge
ui_color_bar_light = #808080
# the bar's dark edge
ui_color_bar_dark = #2D2D2D
# the box behind each menu title (with ui_menu_boxes)
ui_color_menu_box = #585858
# its raised edge, also an open menu's
ui_color_menu_box_light = #808080
# its dark edge
ui_color_menu_box_dark = #808080
# an open menu's background
ui_color_menu = #494949
# windows
ui_color_window = #494949
# windows' light edge
ui_color_window_light = #808080
# windows' dark edge
ui_color_window_dark = #1C1C1C
# fields, lists, inactive tabs
ui_color_field = #353535
# a field under the mouse
ui_color_field_hover = #414141
# hovered / selected / pressed
ui_color_highlight = #9C9C9C
# text
ui_color_text = #E8E8E8
# text on the highlight
ui_color_text_highlight = #FFFFFF
# disabled text
ui_color_text_disabled = #989898
# menu text's shadow (windows' shadows too, at 25%)
ui_color_text_shadow = #1C1C1C
# window title bars, top
ui_color_title = #585858
# window title bars, bottom (the same = flat)
ui_color_title_bottom = #585858
# check marks
ui_color_check = #FFFFFF
# section titles in windows
ui_color_section = #E8E8E8
# buttons, check boxes, scroll bar grips: top
ui_color_button = #585858
# their bottom (the same = flat)
ui_color_button_bottom = #585858
# their light edge (the same as dark = no raised edges)
ui_color_button_light = #585858
# their dark edge
ui_color_button_dark = #585858
# text on buttons
ui_color_button_text = #E8E8E8
# text in fields and combo boxes
ui_color_field_text = #E8E8E8
# the theme's mouse cursor (with ui_theme_cursor)
ui_color_cursor = #BEBEBE
# its top and right edge (the same = flat)
ui_color_cursor_edge = #BEBEBE
