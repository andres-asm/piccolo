# Sega Genesis / Mega Drive 6-button pad (and pads like the 8BitDo M30):
# A B C below, X Y Z above, START and MODE; no sticks, no shoulders.
# The six buttons sit where libretro's Genesis cores expect them on the
# RetroPad: A = Y, B = B, C = A, X = L, Y = X, Z = R.
[layout]
name = GENESIS 6-BUTTON PAD
order = 60
dpad = yes
sticks = 0
face = six

[labels]
x = A
a = B
b = C
leftshoulder = X
y = Y
rightshoulder = Z
back = MODE
start = START
