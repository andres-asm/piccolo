# Sega Saturn pad (and Saturn-style pads): A B C below, X Y Z above, the
# L / R shoulders and START; no sticks, no SELECT. A B C X Y Z sit where
# libretro's cores expect them on the RetroPad (A = Y, B = B, C = A, X = L,
# Y = X, Z = R), so L / R go on L2 / R2.
[layout]
name = SATURN PAD
order = 61
dpad = yes
sticks = 0
face = six

[labels]
x = A
a = B
b = C
leftshoulder = X
y = Y
rightshoulder = Z
lefttrigger = L
righttrigger = R
start = START
