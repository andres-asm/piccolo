# Super Nintendo joypad (and SNES-style pads like the 8BitDo SN30):
# B at the bottom, A on the right; no sticks, triggers or HOME.
[layout]
name = SUPER NINTENDO JOYPAD
order = 30
dpad = yes
sticks = 0

[labels]
a = B
b = A
x = Y
y = X
leftshoulder = L
rightshoulder = R
back = SELECT
start = START
