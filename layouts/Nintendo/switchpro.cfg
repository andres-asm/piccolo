# Switch Pro Controller and Joy-Con pairs: B at the bottom, A on the right.
[layout]
name = SWITCH PRO CONTROLLER
order = 31
sdl_types = switchpro joyconpair
dpad = yes
sticks = 2

[labels]
a = B
b = A
x = Y
y = X
leftshoulder = L
rightshoulder = R
lefttrigger = ZL
righttrigger = ZR
back = -
start = +
guide = HOME
leftstick = LS
rightstick = RS
