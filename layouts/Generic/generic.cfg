# A controller with no particular look: its buttons named by position.
# Layouts are by type of controller, not by model: layouts/<Maker>/<model>.cfg.
# See frontends/common/input_layouts.h for the format; copy one to add yours.
[layout]
name = GENERIC CONTROLLER
order = 0
dpad = yes
sticks = 2

[labels]
a = BOTTOM
b = RIGHT
x = LEFT
y = TOP
leftshoulder = L
rightshoulder = R
lefttrigger = L2
righttrigger = R2
back = SELECT
start = START
guide = HOME
leftstick = L3
rightstick = R3
