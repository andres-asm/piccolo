# piccolo as a Flatpak. Built by .github/workflows/flatpak.yml; locally:
#   flatpak-builder --user --install --force-clean build-flatpak flatpak/site.multitap.piccolo.yml
# The sources are this checkout, with its submodules already in deps/
# (git submodule update --init --recursive).
#
# Inside the sandbox piccolo's folder (cores, saves, settings) is
# ~/.var/app/site.multitap.piccolo/data/piccolo, not ~/.local/share/piccolo.
app-id: site.multitap.piccolo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: piccolo
finish-args:
  - --share=ipc
  - --share=network         # TOOLS > CORES downloads (cores.get-piccolo.app), the network listener
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all            # GPU and game controllers
  - --filesystem=home       # games and cores are picked from anywhere in home

modules:
  # libgamemode, which piccolo's GAME MODE setting loads at run time. Inside a
  # Flatpak it asks the GameMode portal (org.freedesktop.portal.GameMode),
  # which passes the request to GameMode on the host; that needs GameMode
  # installed on the host. Only the library: no daemon, tools or examples.
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-sd-bus-provider=no-daemon
      - -Dwith-examples=false
      - -Dwith-util=false
      - -Dwith-pam-renicing=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/libgamemode.so
      - /lib/libgamemodeauto.so*
    sources:
      - type: dir
        path: ../deps/gamemode

  - name: piccolo
    buildsystem: simple
    build-commands:
      # MULTITAP_PICCOLO_DIR empty: don't copy the build to ~/.local/share.
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMULTITAP_PICCOLO_DIR= -DMULTITAP_BUILD_TESTS=OFF
      - cmake --build build --target piccolo
      # piccolo reads lang/ and layouts/ next to its program (SDL_GetBasePath,
      # which follows the symlink in /app/bin).
      - install -Dm755 build/piccolo /app/lib/piccolo/piccolo
      - cp -r lang layouts /app/lib/piccolo/
      - mkdir -p /app/bin && ln -s ../lib/piccolo/piccolo /app/bin/piccolo
      - install -Dm644 assets/linux/site.multitap.piccolo.desktop /app/share/applications/site.multitap.piccolo.desktop
      - install -Dm644 assets/linux/site.multitap.piccolo.metainfo.xml /app/share/metainfo/site.multitap.piccolo.metainfo.xml
      - install -Dm644 assets/branding/piccolo-icon.svg /app/share/icons/hicolor/scalable/apps/site.multitap.piccolo.svg
      - for size in 16 24 32 48 64 128 256 512; do install -Dm644 assets/branding/png/piccolo-icon-${size}.png /app/share/icons/hicolor/${size}x${size}/apps/site.multitap.piccolo.png; done
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-flatpak
          - .flatpak-builder
          - deps/librashader
          - deps/test-libretro
